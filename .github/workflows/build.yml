name: Build And Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  GOTOOLCHAIN: local
  SPIDERMONKEY: v152.0.4-aistudio2api.1
  DOCKER_METADATA_SHORT_SHA_LENGTH: '6'

jobs:
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.15.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build Frontend
        working-directory: web
        run: |
          npm ci
          npx vp build
      - uses: actions/upload-artifact@v7
        with:
          name: frontend
          path: internal/webui/dist
          retention-days: 1

  web-checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.15.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Check Frontend
        working-directory: web
        run: |
          npm ci
          npm run typecheck
          npm run test
          npm run lint
          npm run format:check

  checks:
    needs: frontend
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        check: [test, vet]
    env:
      CGO_ENABLED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: frontend
          path: internal/webui/dist
      - uses: actions/setup-go@v7
        id: go
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/cache/restore@v5
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-checks-${{ matrix.check }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: go-checks-${{ matrix.check }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}-
      - uses: ./.github/actions/spidermonkey
        with:
          target: linux-amd64-gnu
      - name: Run Unit Tests
        if: matrix.check == 'test'
        run: go test -mod=readonly -trimpath -vet=off ./cmd/... ./internal/...
      - name: Check Minimum Go Version
        if: matrix.check == 'vet'
        run: |
          go version
          go vet -mod=readonly -trimpath ./...
          go build -mod=readonly -trimpath ./cmd/aistudio2api
      - name: Install Windows C Compiler
        if: matrix.check == 'vet'
        run: |
          curl -fsSL https://github.com/mstorsjo/llvm-mingw/releases/download/20261020/llvm-mingw-20261020-ucrt-ubuntu-22.04-x86_64.tar.xz | tar -xJ -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/llvm-mingw-20261020-ucrt-ubuntu-22.04-x86_64/bin" >> "$GITHUB_PATH"
      - uses: ./.github/actions/spidermonkey
        if: matrix.check == 'vet'
        with:
          target: windows-amd64
      - name: Vet Windows Build
        if: matrix.check == 'vet'
        run: CC=x86_64-w64-mingw32-clang CXX=x86_64-w64-mingw32-clang++ GOOS=windows go vet -mod=readonly -trimpath -tags desktop,production ./...
      - uses: actions/cache/save@v5
        if: github.ref == 'refs/heads/main'
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-checks-${{ matrix.check }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}-${{ github.sha }}

  build-linux:
    needs: frontend
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - arch: amd64
            target: x86_64
          - arch: arm64
            target: aarch64
    env:
      CGO_ENABLED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: frontend
          path: internal/webui/dist
      - uses: actions/setup-go@v7
        id: go
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/cache/restore@v5
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-linux-${{ matrix.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: go-linux-${{ matrix.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}-
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: ./.github/actions/spidermonkey
        with:
          target: linux-${{ matrix.arch }}
      - name: Build Packages
        shell: bash
        env:
          GOARCH: ${{ matrix.arch }}
          CC: zig cc -target ${{ matrix.target }}-linux-musl
          CXX: zig c++ -target ${{ matrix.target }}-linux-musl
        run: |
          version="${GITHUB_SHA:0:7}"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then version="$GITHUB_REF_NAME"; fi
          link="-X $(go list -m)/internal/app.version=$version"
          mkdir -p dist
          name="aistudio2api-${version}-linux-${GOARCH}"
          mkdir -p "dist/$name"
          GOOS=linux go build -mod=readonly -trimpath -tags netgo,osusergo -ldflags="-s -w -linkmode external -extldflags '-static -Wl,--strip-all' $link" -o "dist/$name/aistudio2api" ./cmd/aistudio2api
          tar -cf - -C dist "$name" | gzip -9 > "dist/$name.tar.gz"
      - uses: actions/cache/save@v5
        if: github.ref == 'refs/heads/main'
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-linux-${{ matrix.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
      - uses: actions/upload-artifact@v7
        with:
          name: packages-linux-${{ matrix.arch }}
          path: dist/*.tar.gz
          retention-days: 7

  build-windows:
    needs: frontend
    runs-on: ubuntu-24.04
    env:
      CGO_ENABLED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: frontend
          path: internal/webui/dist
      - uses: actions/setup-go@v7
        id: go
        with:
          go-version: stable
          cache: false
      - uses: actions/cache/restore@v5
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-windows-amd64-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: go-windows-amd64-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}-
      - name: Install Windows C Compiler
        run: |
          curl -fsSL https://github.com/mstorsjo/llvm-mingw/releases/download/20261020/llvm-mingw-20261020-ucrt-ubuntu-22.04-x86_64.tar.xz | tar -xJ -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/llvm-mingw-20261020-ucrt-ubuntu-22.04-x86_64/bin" >> "$GITHUB_PATH"
      - uses: ./.github/actions/spidermonkey
        with:
          target: windows-amd64
      - name: Build Package
        shell: bash
        run: |
          version="${GITHUB_SHA:0:7}"
          number=0.0.0
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then version="$GITHUB_REF_NAME"; number="${version#v}"; number="${number%%[-+]*}"; fi
          link="-X $(go list -m)/internal/app.version=$version"
          mkdir -p dist
          CGO_ENABLED=0 go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.29
          jq --arg v "$number" '.fixed.file_version = $v | .info["0000"].ProductVersion = $v' build/windows/info.json > dist/info.json
          wails3 generate syso -arch amd64 -icon build/windows/icon.ico -manifest build/windows/wails.exe.manifest -info dist/info.json -out cmd/aistudio2api/rsrc_windows_amd64.syso
          name="aistudio2api-${version}-windows-amd64"
          mkdir -p "dist/$name"
          CC=x86_64-w64-mingw32-clang CXX=x86_64-w64-mingw32-clang++ GOOS=windows GOARCH=amd64 go build -mod=readonly -trimpath -tags desktop,production -ldflags="-s -w -H windowsgui $link" -o "dist/$name/aistudio2api.exe" ./cmd/aistudio2api
          cp start.bat "dist/$name/"
          (cd dist && zip -9 -qr "$name.zip" "$name")
      - uses: actions/cache/save@v5
        if: github.ref == 'refs/heads/main'
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-windows-amd64-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
      - uses: actions/upload-artifact@v7
        with:
          name: packages-windows-amd64
          path: dist/*.zip
          retention-days: 7

  desktop-macos:
    needs: frontend
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: frontend
          path: internal/webui/dist
      - uses: actions/setup-go@v7
        id: go
        with:
          go-version: stable
          cache: false
      - uses: actions/cache/restore@v5
        with:
          path: |
            ~/go/pkg/mod
            ~/Library/Caches/go-build
          key: go-macos-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: go-macos-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}-
      - uses: ./.github/actions/spidermonkey
        with:
          target: darwin-arm64
      - uses: ./.github/actions/spidermonkey
        with:
          target: darwin-amd64
      - name: Build App
        shell: bash
        env:
          CGO_ENABLED: '1'
          MACOSX_DEPLOYMENT_TARGET: '12.0'
          CGO_CFLAGS: -mmacosx-version-min=12.0
        run: |
          version="${GITHUB_SHA:0:7}"
          number=0.0.0
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then version="$GITHUB_REF_NAME"; number="${version#v}"; number="${number%%[-+]*}"; fi
          link="-X $(go list -m)/internal/app.version=$version"
          mkdir -p dist
          build() {
            export GOARCH=$1
            export CGO_CXXFLAGS="-mmacosx-version-min=12.0 -I$RUNNER_TEMP/spidermonkey/darwin-$1/include"
            export CGO_LDFLAGS="-mmacosx-version-min=12.0 -L$RUNNER_TEMP/spidermonkey/darwin-$1/lib"
            go build -mod=readonly -trimpath -tags desktop,production -ldflags="-s -w $link" -o "dist/aistudio2api-$1" ./cmd/aistudio2api
            name="aistudio2api-${version}-darwin-$1"
            mkdir -p "dist/$name"
            go build -mod=readonly -trimpath -ldflags="-s -w $link" -o "dist/$name/aistudio2api" ./cmd/aistudio2api
            tar -cf - -C dist "$name" | gzip -9 > "dist/$name.tar.gz"
          }
          build arm64 & arm64=$!
          build amd64 & amd64=$!
          wait "$arm64"
          wait "$amd64"
          app=dist/AIStudio2API.app
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          lipo -create -output "$app/Contents/MacOS/aistudio2api" dist/aistudio2api-arm64 dist/aistudio2api-amd64
          cp build/darwin/icons.icns "$app/Contents/Resources/"
          cp build/darwin/Info.plist "$app/Contents/"
          plutil -replace CFBundleShortVersionString -string "$number" "$app/Contents/Info.plist"
          plutil -replace CFBundleVersion -string "$number" "$app/Contents/Info.plist"
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict "$app"
          ditto -c -k --keepParent "$app" "dist/aistudio2api-${version}-darwin-universal.zip"
          mkdir dist/dmg
          cp -R "$app" dist/dmg/
          ln -s /Applications dist/dmg/Applications
          # hdiutil 在 GitHub macOS runner 上偶发 Resource busy，重试三次
          for attempt in 1 2 3; do
            hdiutil create -volname AIStudio2API -srcfolder dist/dmg -fs HFS+ -ov -format ULMO "dist/aistudio2api-${version}-darwin-universal.dmg" && break
            [ "$attempt" = 3 ] && exit 1
            sleep 5
          done
      - uses: actions/cache/save@v5
        if: github.ref == 'refs/heads/main'
        with:
          path: |
            ~/go/pkg/mod
            ~/Library/Caches/go-build
          key: go-macos-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-macos
          path: |
            dist/*.zip
            dist/*.dmg
            dist/*.tar.gz
          retention-days: 7

  desktop-linux:
    needs: frontend
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: frontend
          path: internal/webui/dist
      - uses: actions/setup-go@v7
        id: go
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/cache/restore@v5
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-desktop-linux-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: go-desktop-linux-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}-
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config file libgtk-4-dev libwebkitgtk-6.0-dev
      - uses: ./.github/actions/spidermonkey
        with:
          target: linux-amd64-gnu
      - name: Build Packages
        shell: bash
        run: |
          version="${GITHUB_SHA:0:7}"
          number=0.0.0
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then version="$GITHUB_REF_NAME"; number="${version#v}"; number="${number%%[-+]*}"; fi
          link="-X $(go list -m)/internal/app.version=$version"
          mkdir -p bin dist
          CGO_ENABLED=1 go build -mod=readonly -trimpath -tags desktop,production -ldflags="-s -w $link" -o bin/aistudio2api ./cmd/aistudio2api
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.29
          cp build/appicon.png dist/aistudio2api.png
          # wails3 generate appimage 遍历整个 /usr 查找 WebKit 文件，先用空目录遮住 runner 预装的大型工具目录
          for dir in /usr/local /usr/lib/google-cloud-sdk /usr/share/miniconda /usr/share/dotnet; do sudo mount -t tmpfs none "$dir"; done
          wails3 generate appimage -binary bin/aistudio2api -icon dist/aistudio2api.png -desktopfile build/linux/aistudio2api.desktop -outputdir dist -builddir dist/appimage
          mv dist/aistudio2api-x86_64.AppImage "dist/aistudio2api-${version}-linux-amd64.AppImage"
          VERSION="$number" GOARCH=amd64 wails3 tool package -name aistudio2api -format deb -config build/linux/nfpm.yaml -out dist
          mv dist/aistudio2api*.deb "dist/aistudio2api-${version}-linux-amd64.deb"
      - uses: actions/cache/save@v5
        if: github.ref == 'refs/heads/main'
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-desktop-linux-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-linux
          path: |
            dist/*.AppImage
            dist/*.deb
          retention-days: 7

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [web-checks, checks, build-linux, build-windows, desktop-macos, desktop-linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: '{packages-*,desktop-*}'
          merge-multiple: true
      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" dist/* --verify-tag --generate-notes --title "$RELEASE_TAG" "${flags[@]}"

  docker:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [web-checks, checks, build-linux]
    strategy:
      fail-fast: false
      matrix:
        variant: [browser, no-browser]
        platform: [linux/amd64, linux/arm64]
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: packages-linux-${{ matrix.arch }}
          path: release
      - name: Extract Linux Package
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p "release/linux-$ARCH"
          tar -xzf release/*.tar.gz --strip-components=1 -C "release/linux-$ARCH"
          test -x "release/linux-$ARCH/aistudio2api"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=auto
            ${{ matrix.variant == 'no-browser' && 'suffix=-no-browser,onlatest=true' || '' }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=main-,format=short,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{raw}}
            type=semver,pattern={{version}}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          target: release-${{ matrix.variant }}
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.variant }}-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}-${{ matrix.platform }}
      - name: Smoke Test Image
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
          VARIANT: ${{ matrix.variant }}
        run: |
          docker run --rm --network none --read-only --entrypoint /bin/sh "$IMAGE@$DIGEST" -ec '
            test -x /usr/local/bin/aistudio2api
            LOG_FILE=false aistudio2api -h
            test -s /etc/ssl/certs/ca-certificates.crt
            test -d /usr/share/zoneinfo
            case "$1" in
              browser)
                test -x "$CAMOUFOX_PATH"
                test -f /opt/camoufox/fontconfig/windows/fonts.conf
                test -d /opt/camoufox/fonts/windows
                test ! -e /opt/camoufox/fonts/macos
                test ! -e /opt/camoufox/fontconfig/macos
                command -v Xvfb
                ;;
              no-browser)
                test -z "${CAMOUFOX_PATH:-}"
                test ! -e /opt/camoufox
                for package in libgtk-3-0 libgtk-4-1 xvfb libgl1-mesa-dri; do
                  if dpkg-query -s "$package" >/dev/null 2>&1; then
                    echo "Unexpected browser dependency: $package" >&2
                    exit 1
                  fi
                done
                ;;
              *) exit 1 ;;
            esac
          ' -- "$VARIANT"
      - run: |
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.variant }}-${{ matrix.runner }}
          path: digests/*
          retention-days: 1

  docker-manifest:
    needs: docker
    strategy:
      fail-fast: false
      matrix:
        variant: [browser, no-browser]
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: digests
          pattern: digest-${{ matrix.variant }}-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=auto
            ${{ matrix.variant == 'no-browser' && 'suffix=-no-browser,onlatest=true' || '' }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=main-,format=short,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{raw}}
            type=semver,pattern={{version}}
      - name: Publish Variant Manifest
        working-directory: digests
        shell: bash
        run: |
          shopt -s nullglob
          digests=(*)
          if (( ${#digests[@]} != 2 )); then
            echo "Expected exactly two architecture digests" >&2
            exit 1
          fi
          mapfile -t tags < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          if (( ${#tags[@]} == 0 )); then
            echo "No image tags were generated" >&2
            exit 1
          fi
          args=()
          for tag in "${tags[@]}"; do args+=(--tag "$tag"); done
          for digest in "${digests[@]}"; do args+=("$IMAGE@sha256:$digest"); done
          docker buildx imagetools create "${args[@]}"
        env:
          IMAGE: ${{ steps.image.outputs.name }}
